const background = document.getElementById("background");
const picture = document.getElementById("picture");

background.src = imageData;
picture.src = imageData;

let x = 100;
let y = 100;
let vx = 9;
let vy = 7;
let angle = 0;

function animate() {
    const maxX = Math.max(0, window.innerWidth - picture.offsetWidth);
    const maxY = Math.max(0, window.innerHeight - picture.offsetHeight);

    x += vx;
    y += vy;
    angle += 6;

    if (x <= 0 || x >= maxX) {
        vx *= -1;
        x = Math.max(0, Math.min(x, maxX));
    }

    if (y <= 0 || y >= maxY) {
        vy *= -1;
        y = Math.max(0, Math.min(y, maxY));
    }

    picture.style.transform =
        `translate(${x}px, ${y}px) rotate(${angle}deg)`;

    requestAnimationFrame(animate);
}

picture.onload = () => {
    animate();
};
